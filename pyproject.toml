[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jeju-translator"
version = "0.1.0"
description = "표준어 ↔ 제주어 양방향 번역기"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["torch>=2.1", "transformers>=4.46"]

[project.scripts]
jeju-translate = "jeju_translator.translate:main"

[tool.setuptools.packages.find]
where = ["src"]
